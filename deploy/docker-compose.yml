# Runs the dashboard backend, its Postgres database and the HTTPS origin proxy
# on one Lightsail server. CloudFront sends /api/* traffic to the proxy.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cimb
      POSTGRES_USER: cimb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimb -d cimb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cimb:${POSTGRES_PASSWORD}@db:5432/cimb
    depends_on:
      db:
        condition: service_healthy
    # Reachable from the server itself (follower refresh cron), not the internet.
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ORIGIN_DOMAIN: ${ORIGIN_DOMAIN:?set ORIGIN_DOMAIN in deploy/.env}
      ORIGIN_SECRET: ${ORIGIN_SECRET:?set ORIGIN_SECRET in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
