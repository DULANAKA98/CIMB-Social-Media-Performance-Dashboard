# Deploys main: frontend to S3 + CloudFront, backend to the Lightsail server.
# Required CI/CD variables (Settings → CI/CD → Variables, masked + protected):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION,
#   S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID,
#   SSH_HOST, SSH_USER, SSH_KNOWN_HOSTS, SSH_PRIVATE_KEY (type: File)

stages:
  - deploy

# Builds and uploads in one job, so no job artifacts are passed between jobs
# (the runner cannot upload artifacts to this GitLab instance).
deploy_frontend:
  stage: deploy
  image: node:20-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache aws-cli
  script:
    - cd frontend
    - npm ci
    - VITE_API_URL=/api npm run build
    - aws s3 sync dist "s3://$S3_BUCKET" --delete
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

deploy_backend:
  stage: deploy
  image: alpine:3.20
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 "$SSH_PRIVATE_KEY"
  script:
    # .env files are excluded, so the server's deploy/.env is never overwritten or deleted.
    - >
      rsync -az --delete
      --exclude '.env' --exclude '*.env' --exclude 'venv/' --exclude '__pycache__/' --exclude 'assets/'
      -e "ssh -i $SSH_PRIVATE_KEY"
      backend deploy "$SSH_USER@$SSH_HOST:/opt/cimb/"
    - ssh -i "$SSH_PRIVATE_KEY" "$SSH_USER@$SSH_HOST" "cd /opt/cimb/deploy && docker compose up -d --build"
